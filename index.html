<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#f0f6ff', 500: '#2673e8', 600: '#1c5bba', 900: '#0a2042' } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden relative">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- SIDEBAR (Mobile Responsive Drawer) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-gray-900 text-white flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold">Fashion Admin</h2>
                <p class="text-xs text-primary-500 mt-1 uppercase font-semibold tracking-wider">Store</p>
            </div>
            <button id="btn-close-sidebar" class="md:hidden text-gray-400 hover:text-white text-xl">&times;</button>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Sales dashboard</a>
            <a href="#" class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Orders</a>
            <a href="#" class="block px-4 py-2 rounded bg-primary-600 text-white font-medium">Products</a>
        </nav>
    </aside>

    <!-- MAIN APP WRAPPER -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden md:ml-64">
        
        <!-- HEADER -->
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6">
            <div class="flex items-center gap-4">
                <button id="btn-toggle-sidebar" class="md:hidden text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="font-medium text-gray-600">Add and manage products</div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold">Admin</span>
            </div>
        </header>

        <!-- MAIN AREA -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 bg-gray-50">
            <div class="max-w-5xl mx-auto space-y-6">
                
                <!-- TITLE HEADER -->
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Products</h1>
                        <p class="text-sm text-gray-500">Add and manage products.</p>
                    </div>
                    <button id="btn-show-form" class="bg-primary-600 text-white px-4 py-2 rounded shadow hover:bg-blue-500 transition">
                        + New product
                    </button>
                </div>

                <!-- FORM -->
                <div id="section-form" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hidden">
                    <h2 class="text-lg font-bold mb-4">Add a New Product</h2>
                    <form id="form-categorie" class="space-y-4">
                        <input type="hidden" id="cat-id" value="">
                        
                        <div>
                            <label for="cat-nom" class="block text-sm font-semibold text-gray-700 mb-1">Product Name</label>
                            <input type="text" id="cat-nom" required placeholder="Ex: Summer White T-shirt" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="cat-couleur" class="block text-sm font-semibold text-gray-700 mb-1">Price ($)</label>
                                <input type="number" step="0.01" id="cat-couleur" required placeholder="Ex: 89.99" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                            </div>
                            <div>
                                <label for="cat-icone" class="block text-sm font-semibold text-gray-700 mb-1">Size</label>
                                <select id="cat-icone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    <option value="">-- Choose a Size --</option>
                                    <option value="XS">XS</option>
                                    <option value="S">S</option>
                                    <option value="M">M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex justify-end gap-2 mt-4">
                            <button type="button" id="btn-cancel-form" class="px-4 py-2 text-gray-600 border border-gray-300 rounded hover:bg-gray-100 transition">
                                Cancel
                            </button>
                            <button type="submit" id="btn-submit" class="flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded hover:bg-blue-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
                                <span id="btn-text">Save</span>
                                <svg id="btn-spinner" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- TABLE -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[500px]">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">ID</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Name</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Price / Size</th>
                            </tr>
                        </thead>
                        <tbody id="table-categories-body" class="divide-y divide-gray-100">
                            <!-- Injected by app.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
